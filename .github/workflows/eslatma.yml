# Render bepul serveri uxlab qolmasligi va kundalik eslatmalar o'z vaqtida ketishi uchun
# har 10 daqiqada serverni "uyg'otadi". Repo Settings → Secrets: SITE_URL va CRON_KEY qo'shing.
name: Kundalik eslatma
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Serverni uyg'otish va eslatma yuborish
        run: curl -fsS --retry 3 --max-time 60 "${{ secrets.SITE_URL }}/api/cron?key=${{ secrets.CRON_KEY }}" || true
